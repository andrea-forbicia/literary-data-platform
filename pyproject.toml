[project]
name = "literary-data-platform"
version = "0.1.0"
description = "End-to-end data platform on Open Library and Project Gutenberg open data, with a RAG assistant that cites its sources."
readme = "README.md"
authors = [
    { name = "Andrea Forbicia" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "responses>=0.26.3",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear (likely bugs),
# UP: pyupgrade (modern syntax for the target version), SIM: simplifications.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
