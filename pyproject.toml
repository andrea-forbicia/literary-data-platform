[project]
name = "literary-data-platform"
version = "0.1.0"
description = "End-to-end data platform on Open Library and Project Gutenberg open data, with a RAG assistant that cites its sources."
readme = "README.md"
authors = [
    { name = "Andrea Forbicia" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
